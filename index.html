<!-- 
  🧱 PROFILE CARD (EDUCATIONAL STARTER)
  HTML = structure (what things are). Tailwind CSS = style (how they look).
  Try changing the text, colors, or spacing classes and watch it update!
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat</title>
    <!-- Tailwind CSS via CDN (no install needed) -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="flex min-h-screen items-start justify-center bg-white-600 pt-16">
  </body>
    <img src="https://cdn.omlet.com/images/originals/breed_abyssinian_cat.jpg"
    />

  <!-- Inner <div>: this is the "card" box that holds all the content -->
  <div class="max-w-sm rounded-2xl bg-blue-100 p-6 text-center shadow-xl">

    <!-- <img>: Displays an image. 
         The "src" is the image link. 
         The "alt" text is shown if the image doesn't load. -->
    <img 
      src="https://cdn.omlet.com/images/originals/breed_abyssinian_cat.jpg" 
      alt="Cat"
      class="mx-auto mb-4 h-30 w-30 rounded-full"
    />

    <!-- <h1>: Heading tag (used for titles). 
         Larger headings have lower numbers: <h1> is biggest, <h6> is smallest. -->
    <h1 class="text-2xl font-bold text-blue-500">Cat</h1>

    <!-- <p>: Paragraph tags hold blocks of text. -->
    <p class="mt-2 text-blue-400">Head Cat</p>
    <p class="mt-1 text-sm text-blue-400">"Cat in the Hat"</p>

    <!-- <a>: Anchor tag = link. 
         "href" tells it where to go when clicked.
         "target='_blank'" opens the link in a new tab. -->
    <a 
      href="https://github.com/cat" 
      target="_blank"
      class="mt-4 inline-block rounded-lg bg-blue-500 px-4 py-2 text-white transition hover:bg-blue-600"
    >
      Visit My GitHub
    </a>

  </div> <!-- closes card div -->
  </body>
</html>
